<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>রাগমালা · A — Nocturne</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== A · Nocturne — dark, dense, Spotify-like ===== */
:root{
  --bg:#09090b; --bg2:#121215; --bg3:#1a1a1f; --bg4:#24242b;
  --fg:#f5f5f7; --fg2:#b4b4bf; --fg3:#8e8e9a;
  --acc:#f6b84a; --acc-ink:#1a1200; --acc2:#ff7a59;
  --line:rgba(255,255,255,.08);
  --r:10px; --r2:16px;
  --mini:64px; --tabs:58px; --side:232px;
  --f:"Hind Siliguri",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
img{display:block;max-width:100%}
u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* layout */
.app{min-height:100dvh;display:grid;grid-template-rows:1fr}
main{padding-bottom:calc(var(--mini) + var(--tabs) + 24px);min-width:0}
.screen{display:none;animation:fade .25s var(--ease)}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar (phone) */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:.01em}
.brand small{color:var(--fg3);font-weight:500;margin-left:6px;font-size:.8rem}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--bg3);color:var(--fg);font-weight:600;font-size:.82rem;transition:background .2s}
.pill:hover{background:var(--bg4)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6e5bff,#c04fff);display:grid;place-items:center;font-weight:700;color:#fff;font-size:.9rem}

/* sidebar (desktop) */
.side{display:none}
@media (min-width:900px){
  .app{grid-template-columns:var(--side) 1fr}
  .side{display:flex;flex-direction:column;gap:4px;padding:20px 12px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh}
  .side .brand{padding:6px 12px 18px;font-size:1.4rem}
  .side .nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--fg2);font-weight:600}
  .side .nav-btn svg{width:22px;height:22px}
  .side .nav-btn.on,.side .nav-btn:hover{color:var(--fg);background:var(--bg3)}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
  .tabs{display:none!important}
  main{padding-bottom:calc(var(--mini) + 32px)}
  .top{padding:18px 32px 8px}
  .top .brand{display:none}
}

/* bottom tabs (phone) */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(14,14,17,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:30}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg3);font-size:.7rem;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--fg)}

/* mini player */
.mini{position:fixed;left:8px;right:8px;bottom:calc(var(--tabs) + env(safe-area-inset-bottom) + 6px);height:var(--mini);display:flex;align-items:center;gap:12px;padding:0 10px 0 8px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:31;cursor:pointer}
.mini .thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--bg4)}
.mini .meta{flex:1;min-width:0}
.mini .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .meta span{display:block;color:var(--fg2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ctl{display:flex;gap:4px}
.mini .ctl button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.mini .ctl button:hover{background:var(--bg4)}
.mini .ctl svg{width:24px;height:24px}
.mini .bar{height:2px;background:var(--bg4);border-radius:2px;overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--acc)}
.mini .bar.top{position:absolute;left:12px;right:12px;bottom:0}
.mini .mid{display:flex;flex-direction:column;align-items:center}
.mini .prog{display:none}
.mini .likeb{width:40px;height:40px;border-radius:50%;place-items:center;color:var(--fg2)}
.mini .likeb.on{color:var(--acc2)}
.mini .likeb:disabled{opacity:.4;cursor:default}
.mini .thumb.ph{display:grid;place-items:center;color:var(--fg3);font-size:1.2rem}
.mini .hide-s{display:none}
body[data-screen=now] .mini{display:none}
body[data-screen=now] main{padding-bottom:calc(var(--tabs) + 24px)}
@media (min-width:900px){
  .mini{left:var(--side);right:0;bottom:0;border-radius:0;height:80px;padding:0 24px;border:0;border-top:1px solid var(--line);background:rgba(18,18,21,.96);gap:20px;cursor:default}
  .mini .thumb{width:56px;height:56px}
  .mini .meta{flex:0 0 260px}
  .mini .mid{flex:1;gap:2px}
  .mini .ctl{justify-content:center;gap:10px}
  .mini .hide-s{display:flex}
  .mini .likeb{display:grid}
  .mini .bar.top{display:none}
  .mini .prog{display:flex;align-items:center;gap:8px;width:min(100%,520px);font-size:.72rem;color:var(--fg3);font-variant-numeric:tabular-nums}
  .mini .prog .bar{flex:1;height:4px}
  body[data-screen=now] main{padding-bottom:32px}
  .mini .ctl button.big{width:48px;height:48px;background:var(--fg);color:#000}
  .mini .ctl button.big:hover{transform:scale(1.04);background:#fff}
}

/* headings & rows */
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.005em}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 10px}
.sec-h h2{font-size:1.2rem}
.sec-h a,.sec-h button{color:var(--fg3);font-size:.8rem;font-weight:600}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start;flex:0 0 auto}
@media (min-width:900px){.sec-h,.row{padding-left:32px;padding-right:32px}.row{scroll-padding-inline:32px}}

/* cards */
.card{width:148px;text-align:left;border-radius:var(--r);padding:8px;transition:background .2s;position:relative}
.card:hover{background:var(--bg3)}
.card .art{width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;position:relative;background:var(--bg4);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .art .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:3.6rem;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 2px 20px rgba(0,0,0,.4)}
.card .art .tag{position:absolute;left:8px;bottom:8px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75)}
/* A's raag tile: full name in type, thaat colour band, prahar glyph, faint initial watermark */
.art.tile{background:linear-gradient(160deg,hsl(var(--h) 28% 17%),hsl(var(--h) 36% 9%));padding:10px 10px 10px 16px;display:flex;flex-direction:column;justify-content:flex-end}
.art.tile .band{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,hsl(var(--h) 70% 62%),hsl(var(--h) 60% 40%))}
.art.tile .pg{position:absolute;right:10px;top:10px;width:24px;height:24px;color:var(--acc)}
.art.tile .pg svg{width:100%;height:100%}
.art.tile .wm{position:absolute;right:-4px;top:-18px;font-size:5.6rem;font-weight:700;line-height:1;color:hsl(var(--h) 70% 60% / .08);pointer-events:none}
.art.tile .nm{position:relative;display:block;font-size:1.35rem;font-weight:700;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.art.tile .nm.l{font-size:1.1rem}.art.tile .nm.xl{font-size:.92rem}
.art.tile .tag{position:relative;left:auto;bottom:auto;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dhead .art.tile .nm{font-size:1.7rem}
.card b{display:block;margin-top:10px;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;color:var(--fg2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .play{position:absolute;right:16px;bottom:62px;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:all .2s;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.card:hover .play,.card:focus-within .play{opacity:1;transform:none}
.card .play svg{width:20px;height:20px}
.card.round .art{border-radius:50%}
.card.wide{width:220px}
.card.wide .art{aspect-ratio:16/9}
.mood-card{width:150px;height:92px;border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:#fff;font-weight:700;font-size:1.05rem}
.mood-card small{display:block;font-weight:500;opacity:.8;font-size:.72rem}
.mood-card::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:14px;background:rgba(255,255,255,.18);transform:rotate(25deg)}

/* hero */
.hero{margin:10px 16px 0;border-radius:var(--r2);padding:22px 20px 20px;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.hero>*{position:relative}
.hero .kick{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:2.2rem;line-height:1.1;margin-top:4px}
.hero h1 small{display:block;font-size:1rem;font-weight:500;opacity:.85;margin-top:2px}
.hero p{margin:8px 0 14px;color:rgba(255,255,255,.85);max-width:46ch}
.hero .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--fg);color:#000;transition:transform .15s,background .2s}
.btn:hover{transform:scale(1.03)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px)}
.btn svg{width:22px;height:22px}
.hero .collage{display:none}
@media (min-width:900px){.hero{margin:12px 32px 0;min-height:300px;padding:32px}.hero h1{font-size:3rem}
 .hero .kick,.hero h1,.hero p,.hero .acts{max-width:52%}
 .hero>.collage{display:grid;position:absolute;grid-template-columns:1fr 1fr;gap:12px;right:36px;top:50%;width:min(40%,420px);transform:translateY(-50%) rotate(-5deg)}
 .hero .collage img{aspect-ratio:16/9;object-fit:cover;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15)}
 .hero .collage img:nth-child(2n){transform:translateY(18px)}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:.85rem;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip:hover{color:var(--fg);background:var(--bg4)}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.chip .n{opacity:.7;font-size:.75rem}
@media (min-width:900px){.chips{padding-left:32px;padding-right:32px}}

/* detail pages */
.page{padding:0 16px}
@media (min-width:900px){.page{padding:0 32px;max-width:1100px}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);font-weight:600;margin:6px 0 10px}
.back svg{width:20px;height:20px}
.dhead{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:end}
.dhead .art{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dhead .art .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:3.2rem;font-weight:700}
.dhead .art img{width:100%;height:100%;object-fit:cover}
.dhead .kick{color:var(--fg2);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.dhead h1{font-size:2rem;line-height:1.1}
.dhead .alt{color:var(--fg2);font-size:1rem;margin-top:2px}
.dhead .alt .hi{font-family:"Hind Siliguri",serif;margin-left:6px;color:var(--fg3)}
@media (min-width:900px){.dhead{grid-template-columns:200px 1fr;gap:28px}.dhead h1{font-size:3.2rem}}
.dacts{display:flex;gap:10px;align-items:center;margin:16px 0 8px;flex-wrap:wrap}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);border:1px solid var(--line);transition:all .15s}
.icon-btn:hover{color:var(--fg);background:var(--bg3)}
.icon-btn.on{color:var(--acc2);border-color:var(--acc2)}
.icon-btn svg{width:22px;height:22px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.fact{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fact dt{font-size:.72rem;color:var(--fg3);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.fact dd{margin:4px 0 0;font-weight:600;font-size:1rem}
.fact dd small{display:block;color:var(--fg2);font-weight:500;font-size:.82rem}
.fact.span{grid-column:1/-1}
.notation{font-size:1.1rem;letter-spacing:.03em;line-height:1.9}
.notation.bn{font-size:1.15rem}
/* aligned swara columns: Bengali over roman (or the reverse in English mode) */
.ng{display:flex;gap:clamp(5px,1.8vw,12px);overflow-x:auto;scrollbar-width:none;padding:4px 0 2px;line-height:1.3}
.ng::-webkit-scrollbar{display:none}
.nc{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:1.3em}
.nb{font-size:clamp(1rem,4.2vw,1.3rem);font-weight:600;padding:3px 0}
.ne{font-size:clamp(.82rem,3.1vw,.95rem);color:var(--fg2);letter-spacing:.02em;padding:3px 0}
.ng .sw{margin:0}
.sw{position:relative;display:inline-block;margin-right:.3em}
.sw.up::before,.sw.lo::after{content:"";position:absolute;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.sw.up::before{top:-4px}.sw.lo::after{bottom:-3px}
@media (min-width:900px){.facts{grid-template-columns:repeat(4,1fr)}.fact.span{grid-column:span 2}}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tags .chip{height:30px;font-size:.8rem}
.list{display:flex;flex-direction:column;margin-top:6px}
.item{display:grid;grid-template-columns:28px 96px 1fr auto;gap:12px;align-items:center;padding:8px 8px;border-radius:8px;text-align:left;width:100%;transition:background .15s}
.item:hover{background:var(--bg3)}
.item.on{background:var(--bg3)}
.item .n{color:var(--fg3);font-size:.8rem;text-align:center}
.item.on .n{color:var(--acc)}
.item img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--bg4)}
.item b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;color:var(--fg2);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .dur{color:var(--fg3);font-size:.8rem;font-variant-numeric:tabular-nums}
@media (max-width:420px){.item{grid-template-columns:22px 80px 1fr auto;gap:8px}.item img{width:80px}}
.formh{display:flex;align-items:center;gap:10px;margin:22px 0 6px;color:var(--fg2);font-weight:700;font-size:.9rem}
.formh::after{content:"";flex:1;height:1px;background:var(--line)}

/* now playing */
#now{background:radial-gradient(120% 60% at 50% 0%,var(--tint,#2a2340) 0%,var(--bg) 60%)}
.np{padding:0 16px}
.np .handle{width:40px;height:4px;border-radius:2px;background:var(--fg3);margin:8px auto 8px}
.np .video{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.np .video img{width:100%;height:100%;object-fit:cover;opacity:.9}
.np .video .yt{position:absolute;inset:0;display:grid;place-items:center}
.np .video .yt i{width:68px;height:48px;border-radius:14px;background:#f00;display:grid;place-items:center}
.np .video .yt svg{width:30px;height:30px;color:#fff}
.np .video .lbl{position:absolute;left:10px;top:10px;font-size:.68rem;font-weight:700;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;color:#ddd}
.np .title{margin-top:18px;display:flex;align-items:flex-start;gap:12px}
.np .title h1{font-size:2rem;line-height:1.05}
.np .title h1 small{display:block;font-size:1rem;color:var(--fg2);font-weight:500;margin-top:2px}
.np .title .artist{color:var(--fg2);margin-top:4px}
.np .title .artist a{color:var(--fg);font-weight:600;border-bottom:1px solid var(--line)}
.np .nota{margin-top:14px;display:grid;gap:4px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px}
.np .nota .lab{color:var(--fg3);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.np .ctls{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px 0 10px}
.np .ctls button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--fg);transition:all .15s}
.np .ctls button:hover{background:var(--bg3)}
.np .ctls button.big{width:72px;height:72px;background:var(--fg);color:#000}
.np .ctls button.big:hover{transform:scale(1.04);background:#fff}
.np .ctls button.side{width:44px;height:44px;color:var(--fg2)}
.np .ctls button.side.on{color:var(--acc2)}
.np .ctls svg{width:28px;height:28px}
.np .ctls .big svg{width:36px;height:36px}
.np .seek{display:flex;align-items:center;gap:10px;color:var(--fg3);font-size:.75rem;font-variant-numeric:tabular-nums}
.np .seek .trk{flex:1;height:4px;background:var(--bg4);border-radius:2px;position:relative}
.np .seek .trk i{position:absolute;left:0;top:0;height:100%;width:34%;background:var(--fg);border-radius:2px}
.np .seek .trk i::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--fg)}
.np .queue{margin-top:22px}
.np .queue h2{font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline}
.np .queue h2 span{color:var(--fg3);font-size:.8rem;font-weight:600}
@media (min-width:900px){
  .np{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.9fr);gap:36px;padding:16px 32px;align-items:start}
  .np .handle{display:none}
  .np .queue{margin-top:0;position:sticky;top:16px;max-height:calc(100dvh - 140px);overflow:auto;padding-right:4px}
  .np .title h1{font-size:2.6rem}
}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80dvh;overflow:auto;background:var(--bg2);border-radius:18px 18px 0 0;padding:10px 16px 28px;z-index:41;transform:translateY(100%);transition:transform .3s var(--ease);border-top:1px solid var(--line)}
.sheet{visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
.sheet.on{transform:none;visibility:visible;transition:transform .3s var(--ease),visibility 0s}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--fg3);margin:4px auto 14px}
.sheet h3{font-size:1.1rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{color:var(--fg3);font-size:.85rem;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
@media (min-width:900px){.sheet{left:auto;right:32px;bottom:100px;width:420px;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}

/* search */
.search{margin:6px 16px 10px;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:12px;background:var(--bg3);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;color:var(--fg);font:inherit;font-size:1rem;outline:none;min-width:0}
.search svg{width:22px;height:22px;color:var(--fg3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 16px}
.grid .card{width:auto}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{height:76px;border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;font-weight:700;position:relative;overflow:hidden;color:#fff}
.tile small{font-weight:500;opacity:.8;font-size:.72rem}
.tile::after{content:"";position:absolute;right:-14px;bottom:-24px;width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.14);transform:rotate(-20deg)}
@media (min-width:900px){.search{margin:6px 32px 10px;max-width:560px}.grid,.tile-grid{padding:0 32px}.tile-grid{grid-template-columns:repeat(4,1fr)}}

/* empty */
.empty{margin:30px 16px;padding:34px 20px;border:1px dashed var(--line);border-radius:var(--r2);text-align:center;color:var(--fg2)}
.empty .ic{font-size:2.2rem;margin-bottom:6px}
.empty b{display:block;color:var(--fg);font-size:1.1rem}
.empty p{margin:6px auto 0;max-width:34ch}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--mini) + var(--tabs) + 24px);transform:translateX(-50%) translateY(10px);background:var(--fg);color:#000;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.85rem;opacity:0;transition:all .25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.loading{padding:60px;text-align:center;color:var(--fg3)}
</style>
</head>

 bn:{listen:'শুনুন',browse:'খুঁজুন',juke:'জুকবক্স',mine:'আমার',account:'অ্যাকাউন্ট',nowIs:p=>`এখন ${p}`,playNow:'এখনই শুনুন',shuffle:'এলোমেলো',

  searchPh:'Raags, artists, gharanas…',signIn:'Sign in with Google',signHint:'Keep likes and resume points on every device',likedList:'Liked performances',
  emptyMine:'Nothing liked yet',emptyMineHint:'Tap ♥ on any performance and it will collect here.',never:'Never play',like:'Like',prev:'Previous',next:'Next',play:'Play',pause:'Pause',
  all:'All',any:'Any',views:'views',raagsSung:'Raags sung here',nothing:'Nothing found',tryOther:'Try another spelling',browseBy:'Browse by',

  liked:'Added to likes',unliked:'Removed from likes',nevered:'Will never play again',min:'min',seasonNow:s=>`${s} now — raags of the season`,
  born:'Born',died:'Died',voice:{male:'Male voice',female:'Female voice'},perfN:n=>`${n} performances`,raagN:n=>`${n} raags`,
  jatiN:{audav:'Audav',shadav:'Shadav',sampurna:'Sampurna'},nextUp:'Up next',signedIn:'Not signed in',premium:'YouTube Premium player',signOut:'Sign out',

};
const t=(k,...a)=>{const v=T[L][k];return typeof v==='function'?v(...a):(v??k)};
const nm=o=>L==='bn'?(o.bn||o.en):o.en;
const alt=o=>L==='bn'?o.en:(o.bn||'');
const PR_COL={1:['#f7b267','#f4845f'],2:['#8ecae6','#219ebc'],3:['#ffd166','#f3a712'],4:['#f4a261','#c86b3c'],5:['#e76f8a','#5e3a8c'],6:['#3f51a5','#1b2447'],7:['#2a2f5e','#0d1030'],8:['#6b4c8a','#b07aa1']};
const TH_HUE={bilawal:200,kalyan:42,khamaj:26,bhairav:352,purvi:300,marwa:18,kafi:150,asavari:222,bhairavi:330,todi:268};
const MOOD_COL={shanta:['#2f6f8f','#1c3f55'],bhakti:['#b8862b','#6e4c0f'],shringar:['#c2426b','#6f1e3e'],karuna:['#5a5f9a','#2e3160'],gambhir:['#4e4a3f','#231f1a'],ullas:['#2e9e6b','#176042']};
function praharNow(){const h=new Date().getHours();return h<3?7:h<6?8:Math.floor((h-6)/3)+1}
function seasonNow(){const m=new Date().getMonth()+1;return Object.entries(D.meta.seasons).find(([k,s])=>s.months.includes(m))?.[0]}
const SW_BN={S:'সা',r:'ঋ',R:'রে',g:'জ্ঞ',G:'গা',m:'মা',M:'হ্মা',P:'পা',d:'দ',D:'ধা',n:'ণ',N:'না'};
function notation(seq,script){return (seq||'').split(/\s+/).map(tok=>{const up=tok.includes("'"),lo=tok.startsWith('.'),s=tok.replace(/['.]/g,'');if(!SW_BN[s])return esc(tok);let x=script==='bn'?SW_BN[s]:s.toUpperCase();if(script!=='bn'&&'rgdn'.includes(s))x=`<u>${x}</u>`;if(script!=='bn'&&s==='M')x+='&#x030D;';return `<span class="sw${up?' up':''}${lo?' lo':''}">${x}</span>`}).join(' ')}
/* both scripts, swara by swara in aligned columns (no mid-sequence wrap; scrolls as a last resort) */
const notaBoth=seq=>{const cols=(seq||'').split(/\s+/).filter(Boolean).map(tok=>{const b=`<span class="nb">${notation(tok,'bn')}</span>`,e=`<span class="ne">${notation(tok,'en')}</span>`;return `<span class="nc">${L==='bn'?b+e:e+b}</span>`}).join('');return `<div class="ng" lang="bn">${cols}</div>`};
const jatiTxt=j=>(j||'').split('-').map(x=>T[L].jatiN[x]||x).join(L==='bn'?'–':'–');
const thumb=(id,q='mq')=>`https://i.ytimg.com/vi/${id}/${q}default.jpg`;
const fmtDur=s=>{const m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');return num(`${m}:${ss}`)};
const fmtViews=n=>{if(L==='bn'){if(n>=1e7)return `${num((n/1e7).toFixed(1))} কোটি`;if(n>=1e5)return `${num(Math.round(n/1e5))} লক্ষ`;if(n>=1e3)return `${num(Math.round(n/1e3))} হাজার`;return num(n)}if(n>=1e6)return `${(n/1e6).toFixed(1)}M`;if(n>=1e3)return `${Math.round(n/1e3)}K`;return String(n)};
const seg=(typeof Intl!=='undefined'&&Intl.Segmenter)?new Intl.Segmenter('bn',{granularity:'grapheme'}):null;
const glyph=s=>seg?[...seg.segment(s)][0]?.segment||s[0]:s[0];

function prep(){D.raags.forEach(r=>R[r.id]=r);D.artists.forEach(a=>A[a.id]=a);perfList=Object.entries(D.videos).map(([id,v])=>({id,...v}));}
const perf=id=>D.videos[id]&&{id,...D.videos[id]};
const perfsOf=ids=>(ids||[]).map(perf).filter(Boolean);
const raagPerfs=r=>Object.values(r.videos||{}).flatMap(perfsOf);
const artistThumb=a=>a.videos?.[0]?thumb(a.videos[0]):null;
const perfRaag=p=>R[p.raags?.[0]], perfArtist=p=>A[p.artists?.[0]];
const perfArtistName=p=>p.artists?.length?p.artists.map(i=>A[i]?nm(A[i]):i).join(', '):p.ch;
const raagsFor=p=>D.raags.filter(r=>r.prahar?.includes(p)&&raagPerfs(r).length).sort((a,b)=>a.rank-b.rank);
const artistsWithVideos=()=>D.artists.filter(a=>a.videos?.length).sort((a,b)=>a.rank-b.rank);

/* player state */
const P={cur:null,queue:[],idx:-1,playing:false,likes:new Set(),never:new Set(),recent:[],flt:{}};
function setQueue(list,start=0,label=''){P.queue=list.filter(p=>!P.never.has(p.id));P.label=label;playAt(start)}
function playAt(i){if(!P.queue.length)return;P.idx=(i+P.queue.length)%P.queue.length;P.cur=P.queue[P.idx];P.playing=true;if(!P.recent.find(x=>x.id===P.cur.id))P.recent.unshift(P.cur);renderMini();if(cur==='now')renderNow();}
function toggle(){if(!P.cur){ensureQueue();playAt(0);return}P.playing=!P.playing;renderMini();if(cur==='now')renderNow();}
/* a ready playlist for this hour whenever nothing is queued and no filter is set */
function ensureQueue(){if(P.queue.length||Object.keys(P.flt).length)return;const p=praharNow();P.queue=raagsFor(p).flatMap(raagPerfs).filter(x=>!P.never.has(x.id)).sort(()=>Math.random()-.5);P.label=nm(D.meta.prahars[p]);P.idx=-1}
const praharLabel=r=>(r.prahar||[]).length?r.prahar.map(p=>nm(D.meta.prahars[p])).join(', '):t('anyTime');
const praharHours=r=>(r.prahar||[]).map(p=>`${num(D.meta.prahars[p].from)}:00–${num(D.meta.prahars[p].to)}:00`).join(', ');
function like(id){if(P.likes.has(id)){P.likes.delete(id);toast(t('unliked'))}else{P.likes.add(id);toast(t('liked'))}refresh()}
function never(id){P.never.add(id);toast(t('nevered'));if(P.cur?.id===id){P.queue=P.queue.filter(p=>p.id!==id);P.idx=Math.min(P.idx,P.queue.length-1);P.cur=P.queue[P.idx]||null}refresh()}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1800)}

/* filters for jukebox */
const FKEYS=['time','form','mood','thaat','raag','artist','gharana'];
function matches(p,f){const rs=(p.raags||[]).map(i=>R[i]).filter(Boolean),as=(p.artists||[]).map(i=>A[i]).filter(Boolean);
 if(f.form&&p.form!==f.form)return false;if(f.time&&!rs.some(r=>r.prahar?.includes(+f.time)))return false;if(f.mood&&!rs.some(r=>r.moods?.includes(f.mood)))return false;
 if(f.thaat&&!rs.some(r=>r.thaat===f.thaat))return false;if(f.raag&&!(p.raags||[]).includes(f.raag))return false;if(f.artist&&!(p.artists||[]).includes(f.artist))return false;
 if(f.gharana&&!as.some(a=>a.gharana?.includes(f.gharana)))return false;return true}
const filtered=f=>perfList.filter(p=>matches(p,f)&&!P.never.has(p.id)).sort((a,b)=>b.views-a.views);
function fOptions(k){const f={...P.flt};delete f[k];const base=perfList.filter(p=>matches(p,f));const cnt={};const add=(id)=>cnt[id]=(cnt[id]||0)+1;
 base.forEach(p=>{const rs=(p.raags||[]).map(i=>R[i]).filter(Boolean),as=(p.artists||[]).map(i=>A[i]).filter(Boolean);
  if(k==='form')add(p.form);if(k==='time')new Set(rs.flatMap(r=>r.prahar||[])).forEach(add);if(k==='mood')new Set(rs.flatMap(r=>r.moods||[])).forEach(add);
  if(k==='thaat')new Set(rs.map(r=>r.thaat).filter(Boolean)).forEach(add);if(k==='raag')(p.raags||[]).forEach(add);if(k==='artist')(p.artists||[]).forEach(add);if(k==='gharana')new Set(as.flatMap(a=>a.gharana||[])).forEach(add)});
 const lab=id=>k==='form'?nm({bn:D.meta.forms[id],en:id[0].toUpperCase()+id.slice(1)}):k==='time'?nm(D.meta.prahars[id]):k==='mood'?nm(D.meta.moods[id]):k==='thaat'?nm({bn:D.meta.thaats[id],en:id[0].toUpperCase()+id.slice(1)}):k==='raag'?(R[id]?nm(R[id]):id):k==='artist'?(A[id]?nm(A[id]):id):nm({bn:D.meta.gharanas[id]||id,en:id});
 return Object.entries(cnt).map(([id,n])=>({id,n,lab:lab(id)})).sort((a,b)=>k==='time'?+a.id-+b.id:b.n-a.n)}
function fLabel(k){const v=P.flt[k];if(!v)return t(k);return fOptions(k).find(o=>o.id===v)?.lab||v}

/* svg icons */

  </dl>
  ${row(t('raagsSung'),raags.map(raagCard))}
  <div class="formh">${t('perfs')} · ${num(ps.length)}</div><div class="list">${ps.map((q,i)=>{const qr=perfRaag(q);return `<button class="item${P.cur?.id===q.id?' on':''}" data-play="${q.id}" data-ctx="artist:${id}"><span class="n">${P.cur?.id===q.id?'▶':num(i+1)}</span><img src="${thumb(q.id)}" alt="" loading="lazy"><div style="min-width:0"><b>${esc(qr?nm(qr):q.t)}</b><span>${esc(q.t)}</span></div><span class="dur">${fmtDur(q.sec)}</span></button>`}).join('')}</div>
 </div>`;}
function renderMini(){ensureQueue();const p=P.cur,r=p&&perfRaag(p),pr=D.meta.prahars[praharNow()],pct=p?34:0;
 $('#mini').innerHTML=`<div class="bar top"><i style="width:${pct}%"></i></div>${p?`<img class="thumb" src="${thumb(p.id)}" alt="">`:`<div class="thumb ph">♫</div>`}<div class="meta"><b>${esc(p?(r?nm(r):p.t):t('nowIs',nm(pr)))}</b><span>${esc(p?perfArtistName(p):(P.queue.length?t('readyN',P.queue.length):t('heroHint')))}</span></div>
  <div class="mid"><div class="ctl"><button class="hide-s" data-prev aria-label="${t('prev')}">${I.prev}</button><button class="big" data-toggle aria-label="${p&&P.playing?t('pause'):t('play')}">${p&&P.playing?I.pause:I.play}</button><button data-next aria-label="${t('next')}">${I.next}</button></div><div class="prog hide-s"><span>${p?fmtDur(Math.round(p.sec*.34)):num('0:00')}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${p?fmtDur(p.sec):'–:––'}</span></div></div>
  <button class="likeb hide-s${p&&P.likes.has(p.id)?' on':''}" ${p?`data-like="${p.id}"`:'disabled'} aria-label="${t('like')}">${p&&P.likes.has(p.id)?I.heartF:I.heart}</button>`}

/* sheet */
function openSheet(k){const opts=fOptions(k);$('#sheet').innerHTML=`<div class="handle"></div><h3>${t(k)} <button data-close>${t('done')}</button></h3><div class="opts"><button class="chip${P.flt[k]?'':' on'}" data-set="${k}:">${t('any')}</button>${opts.slice(0,40).map(o=>`<button class="chip${P.flt[k]===o.id?' on':''}" data-set="${k}:${o.id}">${esc(o.lab)} <span class="n">${num(o.n)}</span></button>`).join('')}</div>`;$('#sheet').classList.add('on');$('#sheetBg').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheetBg').classList.remove('on')}
function applyFilters(){const list=filtered(P.flt);const keep=list.findIndex(p=>p.id===P.cur?.id);P.queue=list;P.idx=keep>=0?keep:0;P.cur=list[P.idx]||null;P.label=t('filters');renderMini();renderNow()}

/* routing */
function go(h){location.hash=h}
function route(){const h=location.hash.replace(/^#/,'')||'home';const [s,id]=h.split('/');const scr=['home','browse','now','mine','raag','artist'].includes(s)?s:'home';cur=scr;document.body.dataset.screen=scr;
 $$('.screen').forEach(e=>e.classList.toggle('on',e.id===scr));$$('[data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===scr||(scr==='raag'||scr==='artist')&&b.dataset.go==='home'));
 ({home:renderHome,browse:()=>renderBrowse($('#q')?.value||''),now:renderNow,mine:renderMine,raag:()=>renderRaag(id),artist:()=>renderArtist(id)})[scr]();
 $('#main').scrollTop=0;window.scrollTo(0,0)}
function refresh(){renderMini();route()}
function setLang(l){L=l;document.documentElement.lang=l;$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#lang').textContent=t('lang');$('#langS').textContent=t('lang');refresh()}

/* events */
document.addEventListener('click',e=>{const b=e.target.closest('button,[role=button]');if(!b)return;
 if(b.dataset.playRaag!==undefined){e.stopPropagation();const r=R[b.dataset.playRaag];setQueue(raagPerfs(r),0,nm(r));go('now');return}
 if(b.dataset.playArtist){setQueue(perfsOf(A[b.dataset.playArtist].videos),0,nm(A[b.dataset.playArtist]));go('now');return}
 if(b.dataset.playLikes!==undefined){setQueue([...P.likes].map(perf).filter(Boolean),0,t('likes'));go('now');return}
 if(b.dataset.play){const ctx=b.dataset.ctx;let list=[perf(b.dataset.play)];if(ctx){const [k,id]=ctx.split(':');list=k==='raag'?raagPerfs(R[id]):perfsOf(A[id].videos)}else if(cur==='mine')list=[...P.likes].map(perf).filter(Boolean);const i=Math.max(0,list.findIndex(p=>p.id===b.dataset.play));setQueue(list,i,ctx?nm(ctx.startsWith('raag')?R[ctx.split(':')[1]]:A[ctx.split(':')[1]]):'');if(cur!=='now'&&!ctx)go('now');else refresh();return}
 if(b.dataset.go){go(b.dataset.go);return}
 if(b.dataset.back!==undefined){history.length>1?history.back():go('home');return}
 if(b.dataset.toggle!==undefined){toggle();return}
 if(b.dataset.prev!==undefined){playAt(P.idx-1);return}
 if(b.dataset.next!==undefined){playAt(P.idx+1);return}
 if(b.dataset.like){like(b.dataset.like);return}
 if(b.dataset.never){never(b.dataset.never);return}
 if(b.dataset.qi){playAt(+b.dataset.qi);return}
 if(b.dataset.mood){P.flt={mood:b.dataset.mood};applyFilters();go('now');return}
 if(b.dataset.flt){const [k,v]=b.dataset.flt.split(':');P.flt={[k]:v};applyFilters();go('now');return}
 if(b.dataset.sheet){openSheet(b.dataset.sheet);return}
 if(b.dataset.set!==undefined){const [k,v]=b.dataset.set.split(':');if(v)P.flt[k]=v;else delete P.flt[k];applyFilters();openSheet(k);return}
 if(b.dataset.clear!==undefined){P.flt={};applyFilters();return}
 if(b.dataset.close!==undefined){closeSheet();return}
 if(b.id==='lang'||b.id==='langS'){setLang(L==='bn'?'en':'bn');return}
 if(b.id==='acct'||b.id==='acctS'){toast(t('signIn')+' · '+t('premium'));return}
});
$('#sheetBg').onclick=closeSheet;
$('#mini').addEventListener('click',e=>{if(!e.target.closest('button')&&window.innerWidth<900)go('now')});
window.addEventListener('hashchange',route);
fetch('../../docs/raagmala.json').then(r=>r.json()).then(d=>{D=d;prep();$('#loading').remove();
 /* demo state: a couple of likes + recent, so rows aren't empty */
 const seed=['YeOcx1ox5gQ','-lzurpNhpIQ'].filter(id=>D.videos[id]);seed.forEach(id=>P.likes.add(id));
 setLang('bn')}).catch(e=>{$('#loading').textContent='Could not load ../raagmala.json — serve docs/ over http (e.g. http://localhost:8790/mockups/a.html). '+e});
// a "#home"-style address also names a section id, so the browser jumps to it on load: start at the top instead
addEventListener("load", () => setTimeout(() => window.scrollTo(0, 0), 0));
</script>
</body>
</html>
