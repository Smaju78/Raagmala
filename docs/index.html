<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">

<title>রাগমালা · Raagmala</title>
<meta name="description" content="রাগমালা Raagmala: হিন্দুস্তানি শাস্ত্রীয় কণ্ঠসংগীত, রাগ ও শিল্পী অনুযায়ী — Hindustani classical vocal music by raag and artist: khayal, dhrupad, thumri, with raag facts, the best YouTube performances and a jukebox for the time of day.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#17121b">
<script>
  // Theme and language before the first paint: remembered choices, otherwise the system scheme and Bengali.
  (function () {
    var h = document.documentElement, th = null, lg = null;
    try { th = localStorage.getItem("raagmala.theme"); lg = localStorage.getItem("raagmala.lang"); } catch (e) { /* storage unavailable */ }
    if (th !== "light" && th !== "dark") th = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    h.dataset.theme = th;
    if (lg === "en" || lg === "bn") h.lang = lg;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">

    <a class="nav" href="#/mine" data-nav="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg><span data-i18n="navMine"></span></a>

      <a href="privacy.html" data-i18n="privacy"></a>

  <main>
    <div class="top">
      <a class="brand" href="#/"><span class="seal" aria-hidden="true">রা</span>রাগমালা <small>Raagmala</small></a>
      <a class="searchbar" href="#/browse/raags" data-focus-search><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span data-i18n="searchPh"></span></a>
      <div class="spacer"></div>
      <button class="pill icon theme-toggle" type="button" data-i18n-aria="themeToggle">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="pill lang-switch" type="button" id="lang-switch"></button>
      <span class="account" id="account" hidden></span>
    </div>

    <div id="view" tabindex="-1">
      <div class="loading"><div class="seal" aria-hidden="true">রা</div><p data-i18n="loading"></p></div>
    </div>

    <!-- The jukebox stays in the page on every route (moved off-screen when not shown) so playback continues. -->
    <section id="jb-screen" class="np offstage" aria-hidden="true" data-i18n-aria="navJukebox">
      <div class="np-main">
        <div class="stage">
          <div class="video jb-player">
            <div id="yt-player"></div>
            <div class="jb-empty" id="jb-empty">
              <div class="ic" aria-hidden="true">❖</div>
              <p id="jb-empty-msg"></p>
              <button class="btn sm" type="button" id="jb-empty-play"></button>
              <button class="btn ghost sm" type="button" id="jb-empty-clear" hidden></button>
            </div>
          </div>
          <div class="side-paint" id="jb-paint"></div>
        </div>
        <div id="jb-now"></div>
        <div class="seek">
          <span id="jb-cur">0:00</span>
          <input type="range" id="jb-seek" min="0" max="1000" value="0" step="1" data-i18n-aria="seekAria" disabled>
          <span id="jb-dur">–:––</span>
        </div>
        <div class="ctls">
          <button id="jb-like" class="side" type="button" disabled aria-pressed="false" data-i18n-aria="likeBtnAria" data-i18n-title="likeTitle">
            <svg class="h-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <button id="jb-prev" type="button" disabled data-i18n-aria="prevAria"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button id="jb-play" class="big" type="button" data-playing="false" data-i18n-aria="play">
            <svg class="playi" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button id="jb-skip" type="button" disabled data-i18n-aria="nextAria"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <button id="jb-never" class="side" type="button" disabled data-i18n-aria="never" data-i18n-title="neverTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></button>
        </div>
        <div id="jb-notes"></div>
      </div>
      <div class="queue">
        <div class="qh">
          <h2 data-i18n="playlistHead"></h2>
          <span class="cnt" id="jb-count"></span>
          <button class="btn ghost sm fbtn" type="button" id="jb-edit" aria-expanded="false" aria-controls="sheet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span data-i18n="filters"></span>
          </button>
        </div>
        <div class="active" id="jb-active"></div>
        <p class="upnext" id="jb-next"></p>
        <div id="jb-queue"></div>
      </div>
    </section>

    <footer class="legal">
      <p data-i18n-html="footer1"></p>
      <p data-i18n-html="footer2"></p>
    </footer>
  </main>
</div>

<div class="mini" id="mini" hidden role="region" data-i18n-aria="nowPlaying">
  <div class="bar top"><i id="mini-bar"></i></div>
  <img class="thumb" id="mini-thumb" src="" alt="">
  <a class="meta" id="mini-title" href="#/jukebox"><b id="mini-main"></b><span id="mini-sub"></span></a>
  <div class="mid">
    <div class="ctl">
      <button class="hide-s" type="button" id="mini-prev" data-i18n-aria="prevAria"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="big" type="button" id="mini-play" data-playing="false" data-i18n-aria="miniPlay">
        <svg class="playi" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button type="button" id="mini-skip" data-i18n-aria="nextAria"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    </div>
    <div class="prog hide-s"><span id="mini-cur">0:00</span><div class="bar"><i id="mini-prog"></i></div><span id="mini-dur">–:––</span></div>
  </div>
  <button class="hide-s likeb" type="button" id="mini-like" aria-pressed="false" data-i18n-aria="miniLike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg></button>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">

  <h3><span id="sheet-title" data-i18n="filters"></span><span class="cnt" id="sheet-count"></span><button type="button" id="sheet-close" data-i18n="done"></button></h3>
