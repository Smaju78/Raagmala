<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>রাগমালা · Raagmala</title>
<meta name="description" content="রাগমালা Raagmala: হিন্দুস্তানি শাস্ত্রীয় কণ্ঠসংগীত, রাগ ও শিল্পী অনুযায়ী — Hindustani classical vocal music by raag and artist: khayal, dhrupad, thumri, with raag facts, the best YouTube performances and a jukebox for the time of day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <span class="brand-bn">রাগমালা</span>
    <span class="brand-en" data-i18n="brandSub">Raagmala · Hindustani vocal</span>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#/" data-nav="home" data-i18n="navListen">Listen</a>
    <a href="#/browse/raags" data-nav="browse" data-i18n="navBrowse">Browse</a>
    <a href="#/jukebox" data-nav="jukebox" data-i18n="navJukebox">Jukebox</a>
    <button class="lang" type="button" id="lang-switch">English</button>
    <span class="account" id="account" hidden></span>
  </nav>
</header>

<main id="view" tabindex="-1">
  <p class="loading" data-i18n="loading">রাগ আসছে…</p>
</main>

<!-- The jukebox stays in the page on every route (moved off-screen when not shown) so playback continues. -->
<section id="jukebox" class="jukebox offstage" aria-label="Jukebox">
  <div class="jb-stage">
    <div class="jb-player">
      <div id="yt-player"></div>
      <div class="jb-empty" id="jb-empty">
        <p id="jb-empty-msg"></p>
        <button class="btn" type="button" id="jb-empty-clear" hidden></button>
      </div>
    </div>
    <div class="jb-side">
      <div class="jb-now" id="jb-now"></div>
      <div class="jb-controls">
        <button id="jb-prev" class="btn icon" type="button" disabled data-i18n-aria="prevAria">⏮</button>
        <button id="jb-play" class="btn primary" type="button">▶</button>
        <button id="jb-skip" class="btn icon" type="button" disabled data-i18n-aria="nextAria">⏭</button>
        <button id="jb-like" class="btn" type="button" disabled aria-pressed="false" data-i18n-title="likeTitle">♥</button>
        <button id="jb-never" class="btn" type="button" disabled data-i18n="never" data-i18n-title="neverTitle">Never play</button>
      </div>
      <p class="jb-next hint" id="jb-next"></p>
      <div class="jb-queue" id="jb-queue"></div>
      <div id="jb-notes"></div>
    </div>
  </div>

  <div class="jb-filterbar">
    <span class="jb-count" id="jb-count"></span>
    <div class="jb-active" id="jb-active"></div>
    <button class="btn small" type="button" id="jb-edit" aria-expanded="false" aria-controls="jb-filters" data-i18n="editFilters">Edit filters</button>
  </div>
  <div class="jb-filters" id="jb-filters" hidden></div>
  <details class="jb-prefs" id="jb-prefs"></details>
</section>

<div class="mini" id="mini" hidden>
  <a class="mini-title" id="mini-title" href="#/jukebox"></a>
  <div class="mini-btns">
    <button class="btn icon" type="button" id="mini-play" aria-label="Pause">❚❚</button>
    <button class="btn icon" type="button" id="mini-skip" data-i18n-aria="nextAria">⏭</button>
    <button class="btn icon" type="button" id="mini-like" aria-pressed="false" data-i18n-aria="miniLike">♥</button>
  </div>
</div>

<footer class="foot">
  <p data-i18n-html="footer1"></p>
  <p data-i18n-html="footer2"></p>
</footer>

<dialog class="resume" id="resume" aria-labelledby="resume-title">
  <h2 id="resume-title"></h2>
  <p id="resume-text"></p>
  <div class="resume-btns"><button class="btn primary" type="button" id="resume-yes"></button>
    <button class="btn" type="button" id="resume-no"></button></div>
</dialog>

<script src="app.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
